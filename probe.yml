name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: tilastot
        run: |
          set +e
          t() { echo "== $1"; curl -sS -m 30 -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" "$2"; head -c 300 /tmp/r; echo; }
          t "Tilastokeskus StatFin" "https://statfin.stat.fi/PXWeb/api/v1/fi/StatFin/"
          t "THL Sotkanet indikaattorit" "https://sotkanet.fi/rest/1.1/indicators"
          t "Kela avoin data" "https://beta.kela.fi/etuuskuvaajat"
          t "Traficom avoin" "https://trafi2.stat.fi/PXWeb/api/v1/fi/TraFi/"
          t "SYKE" "https://rajapinnat.ymparisto.fi/api/Hydrologiaws/odata/v1/Vesikunta?%24top=1"
          t "Fingrid" "https://data.fingrid.fi/"
          t "Tulli uljas" "https://uljas.tulli.fi/uljas/graph/api/v1/fi/"
          t "Eurostat katalogi" "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/une_rt_m?geo=FI&format=JSON&lang=fi&sinceTimePeriod=2025-01"
          t "Poliisi/Tike" "https://pxdata.stat.fi/PxWebApi/api/v1/fi/StatFin/"
