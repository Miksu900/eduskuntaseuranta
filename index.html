<!DOCTYPE html>
<html lang="fi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eduskuntaseuranta – miten kansanedustajat äänestävät</title>
<meta name="description" content="Katso, miten kansanedustajasi on äänestänyt eduskunnassa, kuinka usein hän on paikalla ja kuinka usein hän äänestää eri tavalla kuin oma ryhmänsä.">
<meta property="og:title" content="Eduskuntaseuranta – miten kansanedustajat äänestävät">
<meta property="og:description" content="Hae kansanedustajasi ja katso hänen äänestyksensä, läsnäolonsa ja eroavuudet oman ryhmän linjasta.">
<meta property="og:image" content="https://eduskuntaseuranta.fi/og.png"><meta property="og:type" content="website"><meta property="og:locale" content="fi_FI"><meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://eduskuntaseuranta.fi/">
<style>
/*CSS*/
.hero{padding:24px 0 6px}
.hero h1{font-size:clamp(30px,8vw,44px);line-height:1.06;letter-spacing:-.025em;font-weight:800;margin:0 0 16px;max-width:13em}
.find{position:relative}
.find input{width:100%;font:inherit;font-size:18px;color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.find input:focus{outline:none;border-color:var(--accent)}
.find input::placeholder{color:#6f84a3}
.res{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--text)}
.res:hover{text-decoration:none;background:var(--surface)}
.res span{color:var(--mute);font-size:14px;white-space:nowrap}
.hint{margin:10px 0 0;font-size:14px;color:var(--mute)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:26px 0 0}
.links div{display:flex;flex-direction:column}
.links b{font-size:14px;color:var(--mute);font-weight:600;margin:16px 0 4px}
.links a{color:var(--text);font-size:17px;padding:9px 0;border-bottom:1px solid var(--line)}
.links a:hover{color:var(--accent);text-decoration:none}
@media(min-width:720px){.links{grid-template-columns:repeat(4,1fr)}}
.panel{margin-top:34px;padding:20px 14px 16px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(90% 70% at 50% 100%,#17325f 0%,var(--surface) 70%)}
.panel h2{font-size:22px;letter-spacing:-.01em;font-weight:800;margin:0 0 4px}
.when{color:var(--mute);font-size:14px;margin:0 0 4px}
.vt{font-size:17px;line-height:1.35;margin:0 0 6px}
.hemi{display:block;width:100%;height:auto;margin:10px 0 6px;touch-action:manipulation}
.d{fill:#2a3a55;cursor:pointer;transition:fill .45s}
.d.jaa{fill:var(--jaa)}.d.ei{fill:var(--ei)}.d.tyhja{fill:var(--tyhja)}.d.poissa{fill:var(--poissa)}
.d.sel{stroke:#fff;stroke-width:2.2}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:15px}
.leg li{display:flex;align-items:center;gap:7px}
.leg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.leg b{font-weight:700}
.cap{min-height:3em;margin:12px 0 0;font-size:15px;color:var(--mute)}
.cap a{color:var(--text);font-weight:600}
.more{display:inline-block;margin-top:10px;color:var(--text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media(prefers-reduced-motion:reduce){.d{transition:none}}
</style></head><body>
<!--HEADER-->
<main>
<section class="hero">
<h1>Miten kansanedustajasi äänesti?</h1>
<div class="find"><input id="q" type="search" placeholder="Hae edustajaa nimellä" autocomplete="off" aria-label="Hae kansanedustajaa nimellä"><div id="rs"></div></div>
</section>

<nav class="links" aria-label="Sivuston osiot"><!--NAV--></nav>

<section class="panel" id="viimeisin" hidden>
<h2>Viimeisin äänestys</h2>
<p class="when" id="vd"></p>
<p class="vt" id="vt"></p>
<svg class="hemi" id="hemi" viewBox="0 0 400 214" role="img" aria-label="Kaikki edustajat puoliympyrässä, väritetty äänen mukaan"></svg>
<ul class="leg" id="leg"></ul>
<p class="cap" id="cap" aria-live="polite">Jokainen piste on yksi edustaja, puolueittain ryhmiteltynä. Napauta pistettä nähdäksesi, miten hän äänesti.</p>
<a class="more" id="vl" href="/aanestykset/">Avaa tämä äänestys</a>
</section>
</main>
<!--FOOT-->
<script>
const URL_="%%SB%%", KEY="%%KEY%%", P=/*PARTIES*/;
const H={apikey:KEY};
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const pk=p=>{p=String(p||"").trim().toLowerCase();return p==="r"?"rkp":p};
const pn=c=>P[c]||(c?c.toUpperCase():"Ei ryhmää");
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const full=m=>((m.etunimi||"")+" "+(m.sukunimi||"")).trim();
const fd=d=>d?new Date(d).toLocaleDateString("fi-FI"):"";
const AANI={jaa:"Jaa",ei:"Ei",tyhja:"Tyhjää",poissa:"Poissa"};
const COL={jaa:"var(--jaa)",ei:"var(--ei)",tyhja:"var(--tyhja)",poissa:"var(--poissa)"};
async function get(path){const r=await fetch(URL_+"/rest/v1/"+path,{headers:H});if(!r.ok)throw new Error(r.status);return r.json()}
let mps=[],slugs=new Map();
function makeSlugs(){const c={};mps.forEach(m=>{const b=slug(full(m))||String(m.henkilo);c[b]=(c[b]||0)+1});slugs=new Map(mps.map(m=>{const b=slug(full(m))||String(m.henkilo);return[m.henkilo,c[b]>1?b+"-"+m.henkilo:b]}))}
const mpUrl=m=>"/edustaja/"+(slugs.get(m.henkilo)||m.henkilo)+"/";
const norm=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"");

// Haku
$("q").addEventListener("input",function(){
  const n=norm(this.value).trim(),box=$("rs");box.textContent="";
  if(n.length<2)return;
  mps.filter(m=>norm(full(m)).includes(n)).slice(0,6).forEach(m=>{
    const a=el("a","res");a.href=mpUrl(m);a.appendChild(el("b","",full(m)));a.appendChild(el("span","",pn(pk(m.puolue))));box.appendChild(a)});
  if(!box.children.length)box.appendChild(el("p","hint","Ei tuloksia. Kokeile sukunimeä."));
});

// Puoliympyrä: yksi piste per edustaja
function layout(n){
  const R=7,r0=72,r1=192,rs=[];for(let i=0;i<R;i++)rs.push(r0+(r1-r0)*i/(R-1));
  const sum=rs.reduce((a,b)=>a+b,0),cnt=rs.map(r=>Math.round(n*r/sum));
  cnt[R-1]+=n-cnt.reduce((a,b)=>a+b,0);
  const pts=[];rs.forEach((r,i)=>{const k=cnt[i];for(let j=0;j<k;j++){const t=Math.PI*(1-(k===1?.5:j/(k-1)));pts.push({t,r,x:200+r*Math.cos(t),y:204-r*Math.sin(t)})}});
  return pts.sort((a,b)=>b.t-a.t||a.r-b.r);
}
function hemi(v,votes){
  const size={};mps.forEach(m=>{const p=pk(m.puolue);size[p]=(size[p]||0)+1});
  const order=mps.slice().sort((a,b)=>size[pk(b.puolue)]-size[pk(a.puolue)]||pk(a.puolue).localeCompare(pk(b.puolue))||(a.sukunimi||"").localeCompare(b.sukunimi||"","fi"));
  const pts=layout(order.length),svg=$("hemi"),NS="http://www.w3.org/2000/svg";
  svg.textContent="";const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const cs=[];
  order.forEach((m,i)=>{
    const c=document.createElementNS(NS,"circle");c.setAttribute("cx",pts[i].x.toFixed(1));c.setAttribute("cy",pts[i].y.toFixed(1));c.setAttribute("r","5.8");c.setAttribute("class","d");c.dataset.i=i;
    svg.appendChild(c);cs.push(c)});
  const aani=m=>votes.get(m.henkilo)||"poissa";
  setTimeout(()=>cs.forEach((c,i)=>{if(!reduce)c.style.transitionDelay=(i*2.5)+"ms";c.classList.add(aani(order[i]))}),60);
  svg.onclick=e=>{const c=e.target.closest(".d");if(!c)return;
    cs.forEach(x=>x.classList.remove("sel"));c.classList.add("sel");
    const m=order[+c.dataset.i],cap=$("cap");cap.textContent="";
    const a=el("a","",full(m));a.href=mpUrl(m);cap.appendChild(a);
    cap.appendChild(document.createTextNode(" ("+pn(pk(m.puolue))+"): "+AANI[aani(m)]))};
}
function bar(v){
  const t=["jaa","ei","tyhja","poissa"].reduce((s,k)=>s+(v[k]||0),0)||1,b=el("div","sb");
  ["jaa","ei","tyhja","poissa"].forEach(k=>{const i=el("i");i.style.width=(100*(v[k]||0)/t)+"%";i.style.background=COL[k];b.appendChild(i)});return b}
function title(v){return v.otsikko||v.lisaotsikko||"Äänestys "+v.id}

async function init(){
  try{
    const [m,vs]=await Promise.all([
      get("mp_stats?select=henkilo,etunimi,sukunimi,puolue&limit=1000"),
      get("aanestykset?select=id,otsikko,lisaotsikko,alkoi,jaa,ei,tyhja,poissa&ladattu=eq.true&order=alkoi.desc,id.desc&limit=1")]);
    mps=m;makeSlugs();
    if(!vs.length)return;
    const v=vs[0];
    $("viimeisin").hidden=false;
    $("vd").textContent=fd(v.alkoi);$("vt").textContent=title(v);$("vl").href="/aanestys/"+v.id+"/";
    const L=$("leg");[["jaa",v.jaa],["ei",v.ei],["tyhja",v.tyhja],["poissa",v.poissa]].forEach(([k,n])=>{
      const li=el("li");const i=el("i");i.style.background=COL[k];li.appendChild(i);li.appendChild(document.createTextNode(AANI[k]+" "));li.appendChild(el("b","",String(n??"–")));L.appendChild(li)});
    try{
      const r=await get("aanestys_edustaja?aanestys_id=eq."+v.id+"&select=henkilo,aani&limit=400");
      hemi(v,new Map(r.map(x=>[x.henkilo,x.aani])));
    }catch(e){$("hemi").hidden=true;$("cap").textContent=""}
  }catch(e){$("rs").textContent=""}
}
init();
</script></body></html>
