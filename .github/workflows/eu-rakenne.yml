name: EU-rakenne
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  koe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tulosta rakenne
        run: node eu-rakenne.mjs | tee -a $GITHUB_STEP_SUMMARY
