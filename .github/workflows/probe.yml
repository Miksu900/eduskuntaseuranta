name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: tilastot2
        run: |
          set +e
          t() { echo "== $1"; curl -sS -m 40 -D /tmp/h -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" -H "Origin: https://eduskuntaseuranta.fi" "$2"; grep -i "access-control-allow-origin" /tmp/h; head -c "$3" /tmp/r; echo; }
          t "StatFin vaerak" "https://statfin.stat.fi/PXWeb/api/v1/fi/StatFin/vaerak" 600
          t "StatFin tyti" "https://statfin.stat.fi/PXWeb/api/v1/fi/StatFin/tyti" 600
          t "StatFin khi" "https://statfin.stat.fi/PXWeb/api/v1/fi/StatFin/khi" 600
          t "StatFin vaerak 11ra meta" "https://statfin.stat.fi/PXWeb/api/v1/fi/StatFin/vaerak/statfin_vaerak_pxt_11ra.px" 700
          t "Sotkanet alueet" "https://sotkanet.fi/rest/1.1/regions" 400
          t "Sotkanet data" "https://sotkanet.fi/rest/1.1/json?indicator=127&years=2023&genders=total" 500
          t "Traficom ensirek" "https://trafi2.stat.fi/PXWeb/api/v1/fi/TraFi/Ensirekisteroinnit" 500
