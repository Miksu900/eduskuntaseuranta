name: Rajapintatesti
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: EU
        run: |
          set +e
          g() { echo "=== $1"; rm -f /tmp/b; curl -sS -m 40 -L -A "Mozilla/5.0" -H "Accept: application/json" -D /tmp/h -o /tmp/b "$1"; head -n 1 /tmp/h; wc -c < /tmp/b; head -c "${2:-500}" /tmp/b; echo; }
          g "https://howtheyvote.eu/api/votes/198051" 1800
          g "https://howtheyvote.eu/api/members?page_size=2" 600
          g "https://howtheyvote.eu/api/members/2054" 600
          g "https://data.europa.eu/api/hub/search/search?q=financial%20transparency%20system&limit=3&filter=dataset" 900
          g "https://data.europa.eu/api/hub/search/search?q=transparency%20register&limit=3&filter=dataset" 900
          echo "=== TED POST"
          curl -sS -m 40 -X POST -H "Content-Type: application/json" -d '{"query":"organisation-country-buyer=FIN","fields":["notice-title"],"limit":2}' "https://api.ted.europa.eu/v3/notices/search" | head -c 700; echo
