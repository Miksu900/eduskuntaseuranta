name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt4
        run: |
          set +e
          B="https://api.tutkihallintoa.fi/valtiontalous/v1/budjettitaloudentapahtumat"
          t() { echo "== $1"; curl -sS -L -m 90 -D /tmp/h -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" -H "Origin: https://eduskuntaseuranta.fi" "$B?$1" 2>&1 | tail -1; grep -i "access-control-allow-origin" /tmp/h | head -1; head -c 700 /tmp/r | tr '\n' '|'; echo; echo "rivejä: $(wc -l < /tmp/r)"; rm -f /tmp/r /tmp/h; }
          t "vuosiAlkaen=2025&vuosi=2025&paaluokka=28"
          t "vuosi=2025&vuosiAlkaen=2025&paaluokka=28&tililaji=3"
          t "kuukausiAlkaen=1&kuukausi=12&vuosiAlkaen=2025&vuosi=2025&paaluokka=28"
          t "vuosiAlkaen=2025&vuosi=2025"
          exit 0
