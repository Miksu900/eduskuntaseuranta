name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          set +e
          B="https://www.vaalirahoitusvalvonta.fi"
          curl -sS -L -m 30 "$B/fi/index/vaalirahoitus/ilmoituksetvaaleittain/eduskuntavaalit2023/02.html" -o d.html
          tr '\n\r\t' '   ' < d.html | sed 's/  */ /g' > f.html
          echo "##### otsikko: $(grep -oE '<h1[^>]*>[^<]*' f.html | head -1)"
          echo "##### kaikki a-linkit jotka eivät ole valikossa (ensimmäiset 12 joissa sana ilmoitus tai id)"
          grep -oE '<a [^>]*>[^<]{0,80}</a>' f.html | grep -iE 'ilmoitus|raportti|pdf|id=' | head -12 | cut -c1-320
          echo "##### ehdokasrivi"
          grep -oE '.{0,200}(Vaalirahoitusilmoitus).{0,200}' f.html | head -3
          echo "##### data- ja onclick-attribuutit"
          grep -oE '(data-[a-z-]+|onclick)="[^"]{0,120}"' f.html | sort | uniq -c | sort -rn | head -15
          echo "##### tiedosto- ja ilmoitusosoitteet"
          grep -oE '"(/[^"]*(ilmoitus|raportti|document|file|pdf|attachment|vaalirahoitusilmoitus)[^"]*)"' f.html | sort -u | head -15
