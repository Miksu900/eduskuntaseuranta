name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Avoimuusrekisteri
        run: |
          curl -sS -L -m 60 https://public.api.avoimuusrekisteri.fi/swagger-json -o s.json
          echo "koko: $(wc -c < s.json)"
          echo "##### POLUT"
          jq -r '.paths | to_entries[] | .key as $k | .value | to_entries[] | "\(.key|ascii_upcase) \($k)  [\((.value.parameters // []) | map(.name) | join(","))]"' s.json
          echo "##### SKEEMAT"
          jq -r '.components.schemas | keys | join(", ")' s.json | head -c 1500
