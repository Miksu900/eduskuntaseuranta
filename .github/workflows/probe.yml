name: Rajapintatesti
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: EU
        run: |
          set +e
          g() { echo "=== $1"; curl -sS -m 40 -L -A "Mozilla/5.0" -D /tmp/h -o /tmp/b "$1"; head -n 1 /tmp/h; grep -i "^content-type\|^access-control-allow-origin" /tmp/h; wc -c < /tmp/b; head -c 900 /tmp/b; echo; }
          g "https://api.howtheyvote.eu/api/votes?page_size=2"
          g "https://api.howtheyvote.eu/api/members?page_size=2"
          g "https://api.howtheyvote.eu/api/members?country_code=FIN&page_size=2"
          g "https://data.europarl.europa.eu/api/v2/meps?country-of-representation=FI&format=application%2Fld%2Bjson&limit=2"
