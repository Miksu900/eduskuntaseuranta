name: Rajapintatesti
on:
  workflow_dispatch:
    inputs:
      polku:
        description: "Hilma-polku, esim. /avp/eformnotices"
        default: "/avp/eformnotices"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hilma
        env:
          HK: ${{ secrets.HILMA_API_KEY }}
          POLKU: ${{ inputs.polku }}
        run: |
          URL="https://api.hankintailmoitukset.fi$POLKU"
          echo "=== $URL"
          curl -sS -L -m 60 -w "\n[HTTP %{http_code}, %{size_download} tavua, %{content_type}]\n" -H "Ocp-Apim-Subscription-Key: $HK" -H "Accept: application/json" "$URL" | head -c 3500
          echo
