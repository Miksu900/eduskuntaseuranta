name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: hicp3
        run: |
          set +e
          curl -sS -m 90 "https://ec.europa.eu/eurostat/api/dissemination/catalogue/toc/txt?lang=en" -o /tmp/toc.txt
          grep -E '"prc_hicp_(m|a|c|i)[a-z]*"' /tmp/toc.txt | sed -E 's/ +/ /g' | cut -c1-170
          echo ====
          grep -i "2026" /tmp/toc.txt | grep -i "hicp\|inflation\|consumer price" | sed -E 's/ +/ /g' | cut -c1-170 | head -20
