name: Rajapintatesti
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: EU
        run: |
          set +e
          UA="Mozilla/5.0"
          echo "=== 1 HowTheyVote sarakkeet"
          for f in members member_votes votes group_memberships groups national_party_memberships national_parties; do
            echo "--- $f"
            curl -sL "https://github.com/HowTheyVote/data/releases/latest/download/$f.csv.gz" | gunzip 2>/dev/null | head -n 3 | cut -c1-400
          done
          echo "=== 2 Suomalainen lobbariorganisaatio"
          curl -sS -m 150 -L -A "$UA" -o /tmp/tr.xml "https://transparency-register.europa.eu/odplastorganisationxml_en"
          python3 - <<'PY'
          d=open('/tmp/tr.xml',encoding='utf-8').read()
          i=d.find('>Finland<')
          s=d.rfind('<interestRepresentative>',0,i)
          e=d.find('</interestRepresentative>',i)
          print(d[s:e][:3800])
          PY
          echo "=== 3 Koheesio"
          curl -sS -m 40 -D /tmp/h -o /tmp/c.json "https://cohesiondata.ec.europa.eu/resource/557j-pmg8.json?\$limit=1"
          grep -i "^access-control" /tmp/h; head -c 1500 /tmp/c.json; echo
          curl -sS -m 40 "https://cohesiondata.ec.europa.eu/api/catalog/v1?domains=cohesiondata.ec.europa.eu&q=kohesio%20projects&limit=6" | python3 -c "
          import json,sys
          for r in json.load(sys.stdin)['results']: print(r['resource']['id'],r['resource']['name'])"
          echo "=== 4 Eurostat elpymisrahasto"
          curl -sS -m 60 -o /tmp/e.json "https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/gov_rrf_use?format=JSON&lang=EN&geo=IT"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/e.json'))
          print(d.get('id'),d.get('size'))
          for k,v in d['dimension'].items():
              c=v['category']['label']
              print(k,len(c),list(c.items())[:6])
          PY
