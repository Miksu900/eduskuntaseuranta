name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Avoimuusrekisteri
        run: |
          B="https://public.api.avoimuusrekisteri.fi"
          for p in "/swagger/swagger-initializer.js" "/swagger-initializer.js"; do
            echo "=== $B$p"
            curl -sS -L -m 30 -w "\n[HTTP %{http_code}]\n" "$B$p" | head -c 1500
            echo
          done
          for p in "/swagger/doc.json" "/swagger/swagger.json" "/swagger/v1/swagger.json" "/swagger.json" "/docs/json" "/documentation/json" "/json" "/swagger/json" "/api/swagger.json" "/openapi/v1.json"; do
            echo "=== $B$p"
            curl -sS -L -m 30 -w "\n[HTTP %{http_code}, %{content_type}]\n" -H "Accept: application/json" "$B$p" | head -c 400
            echo
          done
