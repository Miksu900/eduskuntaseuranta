name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: PRH
        run: |
          set +e
          g() { echo "=== $1"; curl -sS -L -m 40 -w "\n[HTTP %{http_code}, %{size_download} tavua, %{content_type}]\n" -H "Accept: application/json" "$1" -o r.out; head -c ${2:-1200} r.out; echo; }
          g "https://avoindata.prh.fi/opendata-ytj-api/v3/companies?businessId=0112038-9" 2500
          g "https://avoindata.prh.fi/opendata-ytj-api/v3/companies?name=Nokia&maxResults=3" 1200
          g "https://avoindata.prh.fi/opendata-ytj-api/v3/description?type=companyForms&lang=fi" 500
