name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: avustukset3
        run: |
          set +e
          curl -sS -L -m 30 "https://www.tutkihallintoa.fi/avoimet-rajapinnat/" -o /tmp/c.html -w "ohjesivu HTTP %{http_code} %{size_download}\n"
          sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' /tmp/c.html | tr -s ' \n' | grep -iE "avustus|rajapin|avain|rekister|ilmain|tilaus|api" | head -40 | cut -c1-300
          echo "=== linkit"
          grep -oE 'href="[^"]*(avustus|rajapin|api)[^"]*"' /tmp/c.html | sort -u | head -20
          echo "=== apis-sivu"
          curl -sS -L -m 30 "https://avoindata.tutkihallintoa.fi/apis" -o /tmp/d.html -w "HTTP %{http_code} %{size_download}\n"
          grep -oiE '"[^"]*avustus[^"]*"' /tmp/d.html | sort -u | head -15
          for p in "/developer/apis" "/api/apis" "/apis/avustus"; do curl -sS -L -m 20 -o /dev/null -w "$p HTTP %{http_code}\n" "https://avoindata.tutkihallintoa.fi$p"; done
          exit 0
