name: Rajapintatesti
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: EU
        run: |
          set +e
          UA="Mozilla/5.0"
          echo "=== 1 HowTheyVote rakenne"
          curl -sS -m 60 -A "$UA" -o /tmp/v.json "https://howtheyvote.eu/api/votes/198051"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/v.json'))
          print(list(d.keys()))
          for k in ('member_votes','stats'):
              v=d.get(k)
              if isinstance(v,list): print(k,len(v),json.dumps(v[:2],ensure_ascii=False)[:400])
              elif isinstance(v,dict): print(k,list(v.keys()))
          PY
          echo "=== 2 HowTheyVote data-lataukset"
          curl -sS -m 30 -A "$UA" "https://api.github.com/repos/HowTheyVote/data/releases/latest" | head -c 600; echo
          curl -sS -m 30 -A "$UA" -o /dev/null -w "%{http_code}\n" "https://howtheyvote.eu/api/export"
          echo "=== 3 data.europa.eu: FTS ja avoimuusrekisteri"
          for q in "financial%20transparency%20system%20commitments" "eu%20transparency%20register"; do
            curl -sS -m 60 -A "$UA" -o /tmp/s.json "https://data.europa.eu/api/hub/search/search?q=$q&limit=5&filter=dataset"
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/s.json'))['result']['results']
          for d in r[:5]:
              t=d.get('title') or {}
              print('-',t.get('en') or t.get('fi') or list(t.values())[:1], d.get('id'))
              for x in (d.get('distributions') or [])[:3]:
                  print('    ',(x.get('format') or {}).get('label'),(x.get('download_url') or x.get('access_url') or [''])[0] if isinstance(x.get('download_url') or x.get('access_url'),list) else (x.get('download_url') or x.get('access_url')))
          PY
          done
          echo "=== 4 SPARQL"
          curl -sS -m 40 -A "$UA" "https://publications.europa.eu/webapi/rdf/sparql?query=SELECT%20%3Fs%20WHERE%20%7B%3Fs%20%3Fp%20%3Fo%7D%20LIMIT%201&format=application%2Fsparql-results%2Bjson" | head -c 300; echo
          echo "=== 5 VTV sisalto"
          curl -sS -m 40 -A "$UA" -o /tmp/r.json "https://www.vtv.fi/wp-json/wp/v2/report/28434?_fields=content,excerpt,link"
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/r.json'))
          c=d['content']['rendered']
          print('pituus',len(c))
          print('otsikot',re.findall(r'<h[1-4][^>]*>(.*?)</h[1-4]>',c)[:12])
          print('pdf',re.findall(r'href="([^"]+\.pdf)"',c)[:4])
          t=re.sub(r'<[^>]+>',' ',c)
          t=re.sub(r'\s+',' ',t)
          i=t.find('Lyhyesti')
          print('teksti',t[i:i+900])
          PY
