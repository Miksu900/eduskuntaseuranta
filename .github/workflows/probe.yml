name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: PRH
        run: |
          set +e
          B="https://avoindata.prh.fi/opendata-ytj-api/v3"
          echo "=== CORS"
          curl -sS -m 30 -D - -o /dev/null -H "Origin: https://eduskuntaseuranta.fi" "$B/companies?businessId=0112038-9" | grep -i -E "HTTP/|access-control|content-type"
          echo "=== all_companies (HEAD)"
          curl -sS -m 30 -I -L "$B/all_companies" | grep -i -E "HTTP/|content-type|content-length|content-disposition|location"
          echo "=== swagger"
          curl -sS -m 30 -L "https://avoindata.prh.fi/opendata-ytj-api/v3/api-docs" -o s.json; ls -la s.json
          jq -r '.paths | keys[]' s.json 2>/dev/null | head -30
          echo "=== haku rekisteröintipäivällä"
          curl -sS -m 40 -w "\n[HTTP %{http_code}, %{size_download} tavua]\n" "$B/companies?registrationDateStart=2026-10-01&registrationDateEnd=2026-10-05" -o r.out; head -c 400 r.out; echo
          jq '.totalResults' r.out 2>/dev/null
