name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          B="https://www.vaalirahoitusvalvonta.fi"
          for p in "/fi/index/vaalirahoitus/haetietoavaalirahoitusilmoituksista/ilmoituksethenkiloittain.html" "/fi/index/vaalirahoitus/haetietoavaalirahoitusilmoituksista/enitentukeasaaneet.html" "/fi/index/vaalirahoitus/ilmoituksetvaaleittain/eduskuntavaalit2023.html"; do
            echo "=== $p"
            curl -sS -L -m 30 "$B$p" -o p.html
            echo "--- lomakkeet ja osoitteet"
            grep -oiE '(action|data-url|data-action|data-src|src|url|endpoint|href)[=:] *["'"'"'][^"'"'"']*(json|api|haku|hae|search|query|raportti|excel|csv|xls|export|lataa|ilmoitus)[^"'"'"']*["'"'"']' p.html | sort -u | head -25
            echo "--- fetch/ajax"
            grep -oiE '(fetch|ajax|xhr\.open|\.post|\.get)\([^)]{0,140}\)' p.html | sort -u | head -10
            echo "--- lomake"
            grep -oiE '<(form|input|select)[^>]{0,200}>' p.html | head -12 | cut -c1-220
          done
