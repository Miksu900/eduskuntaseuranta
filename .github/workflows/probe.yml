name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt5
        run: |
          set +e
          B="https://api.tutkihallintoa.fi/valtiontalous/v1/budjettitaloudentapahtumat"
          t() { echo "== $1"; curl -sS -L -m 120 -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" "$B?$1" 2>&1 | tail -1; head -c 500 /tmp/r | tr '\n' '|'; echo; echo "rivejä: $(wc -l < /tmp/r)"; rm -f /tmp/r; }
          t "paaluokka=28"
          t "vuosiAlkaen=2025&paaluokka=28"
          t "kuukausiAlkaen=2025-01&kuukausi=2025-12&paaluokka=28"
          t "kuukausiAlkaen=202501&kuukausi=202512&paaluokka=28"
          t "hetki=2025-12-31&paaluokka=28"
          t "luku=2801&vuosi=2025"
          exit 0
