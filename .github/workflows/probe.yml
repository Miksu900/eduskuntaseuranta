name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          B="https://www.vaalirahoitusvalvonta.fi"
          for p in "/fi/index/vaalirahoitus/haetietoavaalirahoitusilmoituksista/ilmoituksethenkiloittain.html" "/fi/index/vaalirahoitus/ilmoituksetvaaleittain/eduskuntavaalit2023.html" "/fi/index/vaalirahoitus/ilmoituksetvaaleittain/kuntavaalit2025.html"; do
            echo "=== $p"
            curl -sS -L -m 30 -w "[HTTP %{http_code}, %{size_download} tavua]\n" "$B$p" -o p.html
            tail -c 0 p.html
            echo "--- tiedosto- ja hakulinkit"
            grep -oiE 'href="[^"]*(\.csv|\.xlsx|\.xls|\.json|\.zip|\.pdf|haku|rekisteri|api|ilmoitus)[^"]*"' p.html | sort -u | head -30
            echo "--- teksti"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<[^>]*>/ /g' p.html | tr -s ' \n\t' | grep -iE 'ilmoitus|tieto|hae|haku|ehdokas|taulukko|lataa|csv|excel' | head -15 | cut -c1-240
          done
