name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt7
        run: |
          set +e
          B="https://api.tutkihallintoa.fi/valtiontalous/v1"
          t() { echo "== $1"; curl -sS -L -m 60 -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" "$B/$1" 2>&1 | tail -1; head -c 450 /tmp/r | tr '\n' '|'; echo; rm -f /tmp/r; }
          t "budjettitalous"
          t "budjettitalous/vuosikuukausi"
          t "budjettitalous/2025/12"
          t "budjettitalous?vuosi=2025&kuukausi=12"
          t "budjettitalousvuosikuukausi"
          t "budjettitalousvuosikuukausi?vuosi=2025&kuukausi=12"
          t "budjettitalous-vuosi-kuukausi"
          t "budjettitaloudentapahtumat/tiedostot"
          t "budjettitaloudentapahtumat/vuosikuukausi"
          t "budjettitaloudentapahtumat/2025/12"
          t "budjettitaloudentapahtumatiedostot"
          t "budjettitaloudentapahtumat_tiedostot"
          exit 0
