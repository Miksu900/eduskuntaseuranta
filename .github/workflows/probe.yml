name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          set +e
          B="https://www.vaalirahoitusvalvonta.fi"
          curl -sS -L -m 30 "$B/fi/index/vaalirahoitus/ilmoituksetvaaleittain/eduskuntavaalit2023.html" -o l.html
          echo "##### vaalipiirilinkit"
          grep -oE 'href="[^"]*eduskuntavaalit2023/[^"]*"' l.html | sort -u | head -15
          D=$(grep -oE 'href="[^"]*eduskuntavaalit2023/[^"]*"' l.html | grep -i helsin | head -1 | sed -E 's/href="([^"]*)"/\1/')
          [ -z "$D" ] && D=$(grep -oE 'href="[^"]*eduskuntavaalit2023/[^"]*"' l.html | head -1 | sed -E 's/href="([^"]*)"/\1/')
          echo "##### valittu: $D"
          curl -sS -L -m 30 -w "[HTTP %{http_code}, %{size_download} tavua]\n" "$B$D" -o d.html
          echo "##### ilmoituslinkkejä yhteensä: $(grep -oiE 'href="[^"]*"[^>]*>[^<]*Vaalirahoitusilmoitus' d.html | wc -l)"
          echo "##### ensimmäiset 5 linkkiä"
          grep -oiE 'href="[^"]*"[^>]*>[^<]*Vaalirahoitusilmoitus' d.html | head -5 | cut -c1-260
          echo "##### ensimmäinen ehdokas ympäristöineen"
          grep -n -i 'Castr' d.html | head -2 | cut -c1-700
