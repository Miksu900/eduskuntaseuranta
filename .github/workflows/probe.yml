name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Finlex
        run: |
          set +e
          B="https://opendata.finlex.fi/finlex/avoindata/v1"
          a() { echo "=== A (ilman Accept) $1"; curl -sS -L -m 40 -w "\n[HTTP %{http_code}, %{size_download} tavua, %{content_type}]\n" "$B$1" -o r.out; head -c 500 r.out; echo; }
          b() { echo "=== B (Accept json) $1"; curl -sS -L -m 40 -w "\n[HTTP %{http_code}, %{size_download} tavua, %{content_type}]\n" -H "Accept: application/json" "$B$1" -o r.out; head -c 500 r.out; echo; }
          a "/akn/fi/act/statute/list?page=1&limit=100&format=json&startYear=2025&endYear=2025"
          b "/akn/fi/act/statute/list?page=1&limit=100&format=json&startYear=2025&endYear=2025"
          b "/akn/fi/act/statute/list?page=1&limit=100&format=json&startYear=2025"
          b "/akn/fi/act/statute/list?page=1&limit=100&format=json&endYear=2025"
          b "/akn/fi/act/statute/list?page=1&limit=100&format=json&langAndVersion=fin@&startYear=2025&endYear=2025"
          b "/akn/fi/act/statute/list?page=1&limit=100&format=json&langAndVersion=fin@"
          b "/akn/fi/act/statute/list?page=2&limit=100&format=json"
