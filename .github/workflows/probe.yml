name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt3
        run: |
          set +e
          B="https://api.tutkihallintoa.fi/valtiontalous/v1"
          t() { echo "== $1"; curl -sS -L -m 40 -D /tmp/h -o /tmp/r -w "HTTP %{http_code} %{size_download} B\n" -H "Origin: https://eduskuntaseuranta.fi" "$B/$1" 2>&1 | tail -1; grep -i "access-control-allow-origin" /tmp/h | head -1; head -c 450 /tmp/r | tr '\n' '|'; echo; rm -f /tmp/r /tmp/h; }
          t "momentit"
          t "momentit?vuosi=2025"
          t "luvut"
          t "luvut?vuosi=2025"
          t "tapahtumat?vuosi=2025&paaluokka=28"
          t "budjettitaloudentapahtumat?vuosi=2025&paaluokka=28"
          t "budjettitalouden_tapahtumat?vuosi=2025&paaluokka=28"
          t "budjettitalouden-tapahtumat?vuosi=2025&paaluokka=28"
          t "kirjanpitoyksikot"
          t "talousarviokirjanpitotilit"
          t "budjettitaloudentapahtumat-tiedostot"
          t "budjettitalouden-tapahtumat-tiedostot"
          exit 0
