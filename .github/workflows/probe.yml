name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          echo "##### avoindata.fi: hakutulokset"
          for q in vaalirahoitus vaalirahoitusilmoitus ehdokkaan%20vaalirahoitus; do
            echo "=== $q"
            curl -sS -L -m 30 "https://www.avoindata.fi/data/api/3/action/package_search?q=$q&rows=10" | jq -r '.result.results[]? | "\(.title) | \(.organization.title // "") | \(.name) | resursseja: \(.resources|length)"' 2>&1 | head -12
          done
          echo "##### VTV raporttisivu"
          curl -sS -L -m 30 "https://vtv.fi/raportit/vaali-ja-puoluerahoituksen-raportit/" -o v.html
          ls -la v.html
          grep -oiE 'href="[^"]*(\.xlsx|\.xls|\.csv|\.pdf|raportit/[^"]*)"' v.html | sort -u | head -30
          echo "##### VTV teksti"
          sed -e 's/<[^>]*>/ /g' v.html | tr -s ' \n\t' | grep -iE 'ehdokas|eduskuntavaali|excel|csv|avoin|vaalirahoitusilmoitus' | head -12 | cut -c1-240
