name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt10
        run: |
          set +e
          curl -sS -L -m 120 -o /tmp/c.csv "https://tkdpprodjrpstacc02.blob.core.windows.net/valtiontalous/budjettitalous/2025/12/budjettitalous_2025_12.csv"
          python3 - <<'PY'
          import csv,collections
          rows=list(csv.DictReader(open('/tmp/c.csv',encoding='utf-8-sig')))
          def f(x):
              try: return float(x)
              except: return 0.0
          cols=['Alkuperäinen_talousarvio','Voimassaoleva_talousarvio','Käytettävissä','Nettokertymä_ko_vuodelta','Nettokertymä','Loppusaldo']
          print("momentillisia rivejä",sum(1 for r in rows if r['Momentti_TunnusP']))
          print("sarakkeet: alk, voim, käytettävissä, netto_ko_vuodelta, nettokertymä, loppusaldo (milj. €)")
          g=collections.defaultdict(lambda:[0.0]*6)
          nm={}
          for r in rows:
              if not r['Momentti_TunnusP']: continue
              k=r['PaaluokkaOsasto_TunnusP']; nm[k]=r['PaaluokkaOsasto_sNimi'][:28]
              for i,c in enumerate(cols): g[k][i]+=f(r[c])
          for k in sorted(g): print(k,nm[k],[round(x/1e6) for x in g[k]])
          print("--- esimerkki: pääluokka 28 isoimmat momentit")
          m=collections.defaultdict(lambda:[0.0]*6); mn={}
          for r in rows:
              if r['PaaluokkaOsasto_TunnusP']!='28.': continue
              k=r['Momentti_TunnusP']; mn[k]=r['Momentti_sNimi'][:38]
              for i,c in enumerate(cols): m[k][i]+=f(r[c])
          for k,v in sorted(m.items(),key=lambda kv:-abs(kv[1][3]))[:8]: print(k,mn[k],[round(x/1e6) for x in v])
          print("--- TakpT-tyyppien määrät momentillisissa riveissä")
          t=collections.Counter(r['TakpT_sNimi'][:30]+' | '+r['Tililuokka_sNimi'][:24] for r in rows if r['Momentti_TunnusP'])
          for k,v in t.most_common(8): print(k,v)
          PY
          exit 0
