name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          B="https://www.vaalirahoitusvalvonta.fi"
          for p in "/" "/fi/index/vaalirahoitus.html" "/fi/index/vaalirahoitus/vaalirahoitusilmoitus.html" "/fi/index/vaalirahoitus/vaalirahoitusilmoitus/ilmoitusvelvolliset.html"; do
            echo "=== $p"
            curl -sS -L -m 30 "$B$p" -o p.html
            grep -oE 'href="[^"#]+"' p.html | sed 's/href=//' | grep -viE 'facebook|twitter|linkedin|instagram|youtube|\.css|\.ico|javascript' | sort -u | head -70
          done
          echo "##### haku-sanoja"
          for p in "/" "/fi/index/vaalirahoitus.html"; do curl -sS -L -m 30 "$B$p" | grep -oiE '[^<>"]{0,60}(avoin|csv|excel|rajapint|ilmoitusrekisteri|haku|hae )[^<>"]{0,60}' | sort -u | head -25; done
