name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          set +e
          B="https://www.vaalirahoitusvalvonta.fi/fi/index/vaalirahoitus/ilmoituksetvaaleittain/eduskuntavaalit2023/02"
          curl -sS -L -m 60 "$B/0052/vaalirahoitusilmoitus.html" -o i.html
          tr '\n\r\t' '   ' < i.html | sed 's/  */ /g' > f.html
          echo "##### YKSITYISET: taulukon alku"
          grep -oE 'seuraavilta yksityishenkilöiltä.{0,900}' f.html | head -1
          echo
          echo "##### YRITYKSET: taulukon alku"
          grep -oE 'seuraavilta yrityksiltä.{0,900}' f.html | head -1
          echo
          echo "##### kaikki taulukoiden otsikkorivit"
          grep -oE '<th[^>]*>[^<]{1,60}</th>' f.html | sort | uniq -c | sort -rn | head -20
