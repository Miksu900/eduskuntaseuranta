name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: vt9
        run: |
          set +e
          curl -sS -L -m 120 -o /tmp/c.csv "https://tkdpprodjrpstacc02.blob.core.windows.net/valtiontalous/budjettitalous/2025/12/budjettitalous_2025_12.csv"
          python3 - <<'PY'
          import csv,collections
          rows=list(csv.DictReader(open('/tmp/c.csv',encoding='utf-8-sig')))
          print("rivejä",len(rows))
          def f(x):
              try: return float(x)
              except: return 0.0
          c=collections.defaultdict(lambda:[0,0.0,0.0])
          for r in rows:
              k=(r['TakpT_TunnusP'],r['TakpT_sNimi'],r['Tilaji_sNimi'] if False else r['Tililaji_sNimi'])
              a=c[(r['TakpT_sNimi'][:30],r['Tililaji_sNimi'][:28])]
              a[0]+=1;a[1]+=f(r['Nettokertymä_ko_vuodelta']);a[2]+=f(r['Käytettävissä'])
          print("--- TakpT / Tililaji: rivit, nettokertymä ko vuodelta, käytettävissä")
          for k,v in sorted(c.items(),key=lambda kv:-kv[1][0])[:25]:
              print(k,v[0],round(v[1]/1e6),round(v[2]/1e6))
          print("--- paaluokka menot (Tililaji sisältää 'MENOT' tai 'menot')")
          m=collections.defaultdict(float)
          for r in rows:
              if 'enot' in r['Tililaji_sNimi'] or 'ENOT' in r['Tililaji_sNimi']:
                  m[(r['PaaluokkaOsasto_TunnusP'],r['PaaluokkaOsasto_sNimi'][:35])]+=f(r['Nettokertymä_ko_vuodelta'])
          for k,v in sorted(m.items(),key=lambda kv:-kv[1])[:15]: print(k,round(v/1e6))
          print("--- ylatiliryhmat")
          y=collections.Counter((r['Tililuokka_sNimi'][:30],r['Ylatiliryhma_sNimi'][:30]) for r in rows)
          for k,v in y.most_common(14): print(k,v)
          PY
          exit 0
