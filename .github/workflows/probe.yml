name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: VTV
        run: |
          set +e
          for u in "https://www.vtv.fi/wp-json/wp/v2/types" "https://www.vtv.fi/wp-json/wp/v2/posts?per_page=3&_fields=id,date,link,title,type" "https://www.vtv.fi/feed/" "https://www.vtv.fi/wp-sitemap.xml" "https://www.vtv.fi/tarkastukset/"; do
            echo "=== $u"
            curl -sS -m 30 -L -A "Mozilla/5.0" -D /tmp/h -o /tmp/b "$u"
            head -n 1 /tmp/h; grep -i "^content-type\|^access-control" /tmp/h
            wc -c < /tmp/b
            head -c 700 /tmp/b; echo
          done
