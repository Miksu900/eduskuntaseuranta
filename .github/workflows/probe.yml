name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          mkdir -p w && cd w
          for u in "https://www.vaalirahoitusvalvonta.fi/fi/index/avoindata.html" "https://www.vaalirahoitusvalvonta.fi/fi/index/vaalirahoitus.html" "https://www.vaalirahoitusvalvonta.fi/" "https://www.vaalirahoitusvalvonta.fi/fi/index/vaalirahoitusilmoitukset.html"; do
            echo "=== $u"
            curl -sS -L -m 30 -w "[HTTP %{http_code}, %{size_download} tavua, %{url_effective}]\n" "$u" -o p.html
            tail -c 0 p.html
            grep -oiE 'href="[^"]*(csv|xlsx|xls|json|api|avoin|open|data|ilmoitus)[^"]*"' p.html | sort -u | head -40
          done
          echo "##### avoindata-sivun teksti"
          curl -sS -L -m 30 "https://www.vaalirahoitusvalvonta.fi/fi/index/avoindata.html" | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 2500
