name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: avustukset
        run: |
          set +e
          S="https://avoindata.suomi.fi/data/api/3/action/package_search"
          for q in valtionavustus avustuspäätökset valtiokonttori; do
            echo "=== $q"
            curl -sS -m 40 "$S?q=$q&rows=8" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)['result']
          print('osumia',d['count'])
          for p in d['results']:
              t=p.get('title_translated') or {}
              print('-',p['name'],'|',(t.get('fi') or p.get('title') or '')[:70])
              for r in p.get('resources',[])[:3]:
                  print('    ',(r.get('format') or '?'),(r.get('url') or '')[:110])
          "
          done
          echo "=== valtiokonttori suoraan"
          for u in "https://www.valtionavustukset.fi/" "https://avustukset.valtiokonttori.fi/" "https://tutkimus.valtiokonttori.fi/"; do
            curl -sS -L -m 30 -o /tmp/r -w "$u HTTP %{http_code} %{size_download}\n" "$u"
          done
