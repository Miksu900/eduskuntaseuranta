name: probe
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: hicp2
        run: |
          set +e
          curl -sS -m 90 "https://ec.europa.eu/eurostat/api/dissemination/catalogue/toc/txt?lang=en" -o /tmp/toc.txt
          ls -la /tmp/toc.txt
          grep -i "hicp" /tmp/toc.txt | grep -i "annual rate" | cut -c1-200
