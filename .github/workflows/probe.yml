name: Rajapintatesti
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: VTV
        run: |
          set +e
          g() { echo "=== $1"; curl -sS -m 30 -L -A "Mozilla/5.0" -D /tmp/h -o /tmp/b "$1"; head -n 1 /tmp/h; grep -i "^x-wp-total" /tmp/h; }
          g "https://www.vtv.fi/wp-json/wp/v2/types"
          python3 -c "import json;d=json.load(open('/tmp/b'));print({k:v['rest_base'] for k,v in d.items()})"
          g "https://www.vtv.fi/wp-json/wp/v2/categories?per_page=100&_fields=id,name,slug,count,parent"
          python3 -c "import json;[print(c['id'],c['slug'],c['count'],c['parent']) for c in json.load(open('/tmp/b'))]"
          g "https://www.vtv.fi/wp-json/wp/v2/posts?per_page=1&search=tarkastuskertomus&_fields=id,link,categories"
          head -c 400 /tmp/b; echo
