name: Rajapintatesti
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Vaalirahoitus
        run: |
          B="https://www.vaalirahoitusvalvonta.fi"
          for p in "/webcomponents/julkinenpalvelu/vaalirahoitustiedot/vaaliraportti.html" "/webcomponents/julkinenpalvelu/vaalirahoitustiedot/vaaliraporttiluonti.html"; do
            echo "=== $p"
            curl -sS -L -m 30 -w "[HTTP %{http_code}, %{size_download} tavua]\n" "$B$p" -o c.html
            tail -c 0 c.html
            echo "--- osoitteet ja toiminnot"
            grep -oE '(luovaaliraportti|valitseraportti|haeraportti|lataaraportti|raporttistatus|tilaraportti)[^;]{0,200}' c.html | head -12 | cut -c1-260
            grep -oE '["'"'"'](/[a-zA-Z0-9_./?=&-]*(\.stx|\.json|\.csv|\.xls|\.xlsx|raportti|report|download|lataa)[a-zA-Z0-9_./?=&-]*)["'"'"']' c.html | sort -u | head -25
            echo "--- ajax-kutsut"
            grep -oE '(\$\.(ajax|post|get|getJSON)|fetch|xhr\.open|url:)[^;]{0,200}' c.html | head -15 | cut -c1-260
          done
