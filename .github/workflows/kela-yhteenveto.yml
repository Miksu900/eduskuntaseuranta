name: kela-yhteenveto
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/kela-yhteenveto.yml"
permissions:
  contents: write
  actions: write
jobs:
  yhteenveto:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Laske Kelan kuntayhteenveto
        run: |
          set -o pipefail
          node kela-yhteenveto.mjs 2>&1 | tee -a $GITHUB_STEP_SUMMARY
      - name: Tallenna data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/kela
          git diff --cached --quiet && echo "Ei muutoksia" && exit 0
          git commit -m "Kela: kuntakohtainen yhteenveto"
          git pull --rebase origin main
          git push
