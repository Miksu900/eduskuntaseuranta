name: Syötekoe (viranomaisten RSS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/syotekoe.mjs]
permissions:
  contents: write
jobs:
  koe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/syotekoe.mjs
      - name: Tallenna tulos haaraan
        run: |
          git config user.name koe; git config user.email koe@users.noreply.github.com
          git checkout -B koetulos
          git add -f syotekoe-tulos.json && git commit -qm "Syötekokeen tulos" && git push -qf origin koetulos
