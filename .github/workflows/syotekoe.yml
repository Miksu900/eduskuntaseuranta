name: Syötekoe (viranomaisten RSS)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/syotekoe.mjs]
jobs:
  koe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/syotekoe.mjs
