name: Korjaa kirjoitusvirhe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  korjaa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Korjaa
        run: |
          sed -i 's/lasketu yhteen/laskettu yhteen/' build.mjs
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add build.mjs
          git diff --cached --quiet || (git commit -m "Korjaa kirjoitusvirhe" && git push)
