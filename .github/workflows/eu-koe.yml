name: EU-koehaku
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  koe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kokeile lähteet
        run: node eu-koe.mjs | tee -a $GITHUB_STEP_SUMMARY
