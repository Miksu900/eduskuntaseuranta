name: EU-maat
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  haku:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hae ja tiivistä
        run: node eu-maat.mjs | tee -a $GITHUB_STEP_SUMMARY
      - name: Tallenna
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/eu-maat
          if git diff --cached --quiet; then
            echo "Ei muutoksia"
          else
            git commit -m "EU-maat: ohjelmat ja saajat maittain"
            git push
          fi
