name: Hinta-haku
on:
  workflow_dispatch:
  schedule:
    - cron: "5 */3 * * *"
permissions:
  contents: write
  actions: write
jobs:
  haku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hae hinnat
        run: node hinta-haku.mjs | tee -a $GITHUB_STEP_SUMMARY
      - name: Tallenna ja rakenna
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/hinta
          if ! git diff --cached --quiet; then
            git commit -m "Hinnat päivitetty" && git push && gh workflow run build.yml
          fi
