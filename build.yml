name: Rakenna ja julkaise sivusto
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: fetch-${{ github.run_id }}
          restore-keys: fetch-
      - run: node build.mjs
        env:
          HILMA_API_KEY: ${{ secrets.HILMA_API_KEY }}
          FETCH_TTL_H: ${{ github.event_name == 'push' && '24' || '0' }}
      - uses: actions/cache/save@v4
        if: github.event_name != 'push'
        with:
          path: .cache
          key: fetch-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
