name: Valtiontalous-arkisto
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 2"
permissions:
  contents: write
  actions: write
concurrency:
  group: valtiontalous-arkisto
  cancel-in-progress: false
jobs:
  lataa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lataa budjettitalous
        run: node valtiontalous-arkisto.mjs
      - name: Tallenna arkisto
        if: always()
        run: |
          git config user.name "valtiontalous-arkisto"
          git config user.email "actions@users.noreply.github.com"
          git add data/valtiontalous
          if git diff --cached --quiet; then echo "Ei muutoksia"; else git commit -m "Valtiontalous-arkisto päivitetty" && git pull --rebase origin main && git push; fi
